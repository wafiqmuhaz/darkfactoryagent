events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Without an explicit resolver, nginx resolves an upstream
    # hostname once at startup and caches that IP for the life of the process — so
    # after a backend rebuild it keeps proxying to a stale address, which may now
    # belong to a worker replica that registers no API routes (every route 404s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            # Using a variable in proxy_pass forces per-request re-resolution
            # through the resolver above instead of a one-time startup lookup.
            set $backend_upstream backend-api:3001;
            proxy_pass http://$backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Adapter CLI runs take minutes; nginx's 60s default would cut them off.
            proxy_connect_timeout 10s;
            proxy_send_timeout 700s;
            proxy_read_timeout 700s;
        }
    }
}
