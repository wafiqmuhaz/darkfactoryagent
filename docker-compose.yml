services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-api
    networks:
      - dark-factory-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 1
    environment:
      - NODE_ENV=production
      - PROCESS_MODE=api
      - PORT=3001
      - DATABASE_URL=file:./dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dark_factory_super_secret_key_change_me
      - ADAPTER_DEFAULT=claude-code
      - COST_MAX_BUDGET=10
      - ROUTINE_TIMEZONE=UTC
      # Adapter CLI credentials — set these in your shell or a .env file next to this compose file.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./backend/prisma:/app/prisma
      - datalake_data:/app/datalake
      # Mount local projects so the agent can access them inside the container
      - /Users/putramac/Documents/GitHub:/Users/putramac/Documents/GitHub
      # Adapter CLI auth/config, so `claude` and `codex` inside the container reuse host logins.
      # claude.json sits beside the directory and is required — the CLI refuses to start without it.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      - ${HOME}/.codex:/root/.codex
    networks:
      - dark-factory-network

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      - NODE_ENV=production
      - PROCESS_MODE=worker
      - DATABASE_URL=file:./dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADAPTER_DEFAULT=claude-code
      - COST_MAX_BUDGET=10
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./backend/prisma:/app/prisma
      - datalake_data:/app/datalake
      - /Users/putramac/Documents/GitHub:/Users/putramac/Documents/GitHub
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      - ${HOME}/.codex:/root/.codex
    networks:
      - dark-factory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - api-gateway
    networks:
      - dark-factory-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dark-factory-network

  # Adapter CLIs are installed directly in the backend image (see backend/Dockerfile),
  # so no sidecar is required. The probe still checks running containers as a fallback,
  # which covers setups where the CLIs live in a separate container instead.

volumes:
  redis_data:
  datalake_data:

networks:
  dark-factory-network:
    driver: bridge
