services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-api
    networks:
      - dark-factory-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 1 # Scale this up for horizontal API scaling
    environment:
      - NODE_ENV=production
      - PROCESS_MODE=api
      - PORT=3001
      - DATABASE_URL=file:./dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dark_factory_super_secret_key_change_me
    depends_on:
      - redis
    volumes:
      - ./backend/prisma:/app/prisma
      - datalake_data:/app/datalake
    networks:
      - dark-factory-network

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 2 # Horizontal scaling for Agents
    environment:
      - NODE_ENV=production
      - PROCESS_MODE=worker
      - DATABASE_URL=file:./dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./backend/prisma:/app/prisma
      - datalake_data:/app/datalake
    networks:
      - dark-factory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - api-gateway
    networks:
      - dark-factory-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dark-factory-network

volumes:
  redis_data:
  datalake_data:

networks:
  dark-factory-network:
    driver: bridge
